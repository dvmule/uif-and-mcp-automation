name: Deploy delivery-outcome POC — Dev

# The UIFPE-453 production-faithful POC (delivery-lab/reference-implementations/
# uifpe-453-delivery-outcome-tracking): three uif-event-poc-* DynamoDB tables
# that are VERBATIM copies of the real ADR-0007 Tables 3/4/5 — same keys, same
# indexes, same INCLUDE/KEYS_ONLY projections — plus a bus with event-bus
# logging at INFO, and publisher / event-handler / delivery-poller Lambdas.
#
# WHY IT REPLACED BOTH EARLIER POCs (2026-09-30): each projected ALL on every
# index and invented indexes production does not have, so POC code passed
# locally and would have failed in production. Two concrete instances: reading
# published_at off gsi_event_id (not projected in production) and querying
# gsi_pending / publish-metrics.gsi_gold_run (do not exist in production).
# Fidelity is the feature here; do not "tidy" a projection.
#
# Deliberately different from the stack deploys: a push to develop only ever
# validates — applying, destroying, and even planning-with-refresh a POC are
# explicit workflow_dispatch choices, and the dispatch input is the latch.
#
# NOTE ON PERMISSIONS: echo-dev-github-actions is scoped to DynamoDB
# table/*dev* and events rule/*dev*, and carries no SQS, Kinesis,
# Lambda-management or IAM statements at all. uif-event-poc-* matches none of
# that. This isn't only an apply/destroy problem: once real state exists,
# `terraform plan` also has to refresh every resource already in state before
# it can diff anything, and that refresh hits the exact same AccessDenied —
# confirmed live on 2026-09-30 (run 36705583405) once the POC's 46 resources
# actually existed. workflow_dispatch doesn't route around this either: every
# trigger assumes the same OIDC role, so plan, apply, and destroy are all
# blocked in CI regardless of how the run started, until
# stacks/echo/infrastructure/terraform/iam.tf is extended. Until then, push
# runs terraform validate + fmt -check only — no AWS calls, so nothing here
# can fail on access. Real plan/apply/destroy stay as workflow_dispatch
# options for when IAM is extended; today they're run by hand under
# PowerUser, exactly how this POC's own destroy-and-rebuild was done.

on:
  push:
    branches: [develop]
    paths:
      - "delivery-lab/reference-implementations/uifpe-453-delivery-outcome-tracking/**"
      - ".github/workflows/deploy-delivery-poc-dev.yml"
  workflow_dispatch:
    inputs:
      infra:
        description: "Terraform action for the POC stack"
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency:
  group: deploy-delivery-poc-dev
  cancel-in-progress: false

env:
  ENV: dev
  AWS_REGION: eu-west-1
  POC_ROOT: delivery-lab/reference-implementations/uifpe-453-delivery-outcome-tracking

jobs:
  test:
    name: Local simulation (moto drives the real handlers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install suite dependencies
        run: pip install -r $POC_ROOT/local-simulation/requirements.txt
      - name: Run the local suite
        run: python $POC_ROOT/local-simulation/run_poc_local.py

  deploy:
    name: Terraform (delivery-outcome POC, dev)
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve action
        id: act
        run: |
          ACTION="${{ github.event_name == 'workflow_dispatch' && inputs.infra || 'validate' }}"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "::notice::POC terraform action: $ACTION (push only ever validates config — plan/apply/destroy are dispatch choices, and need IAM extended before they can succeed)"

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: steps.act.outputs.action != 'validate'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        if: steps.act.outputs.action == 'validate'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend — validate needs no AWS access)
        if: steps.act.outputs.action == 'validate'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        if: steps.act.outputs.action == 'validate'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform validate

      - name: Terraform init
        if: steps.act.outputs.action != 'validate'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform init -reconfigure -backend-config=backends/$ENV.s3.tfbackend

      - name: Terraform plan
        if: steps.act.outputs.action != 'validate' && steps.act.outputs.action != 'destroy'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform plan -out=$ENV.tfplan

      - name: Terraform apply
        if: steps.act.outputs.action == 'apply'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform apply $ENV.tfplan

      - name: Terraform destroy
        if: steps.act.outputs.action == 'destroy'
        working-directory: ${{ env.POC_ROOT }}/terraform
        run: terraform destroy -auto-approve
