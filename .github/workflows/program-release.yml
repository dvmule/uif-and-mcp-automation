name: Release program — cut the build tag

# Trigger path only. The body is in release-domain.yml.
#
# Fires when program's declared version changes on develop, and cuts
# `program/vX.Y.Z` so the domain can be deployed to UAT at a pinned version
# instead of at whatever is on develop at dispatch time (UIFPE-656).
#
# The version is DECLARED, not derived: semver is a claim about whether
# consumers break, and only a human who understands the change can make it.
# check-version.sh stops the three mistakes that claim invites -- a malformed
# number, one that has already shipped, and one that goes backwards.

on:
  push:
    branches: [develop]
    paths:
      - "domains/program/VERSION"
  workflow_dispatch:

# A CALLED WORKFLOW CANNOT EXCEED THE CALLER'S PERMISSIONS, so these are
# declared here rather than left to the default. release-domain.yml's `tag` job
# needs `contents: write` to push the tag, and its `gate` job needs
# `actions: read` to look up the dev deploy run. Omitting this block is what
# made the first four release runs fail with `startup_failure` before any job
# started -- no logs, no annotation, just a refusal. gold-schemas.yml, the
# repo's other reusable workflow, needs no such block because it is entirely
# read-only.
permissions:
  contents: write
  actions: read

jobs:
  release:
    uses: ./.github/workflows/release-domain.yml
    with:
      domain: program
