name: Intake Compile

# The second half of a wizard submission (UIFPE-218). The submission service
# puts ONLY the intake envelope on an intake/UIFPE-<n>-* branch — this
# workflow runs the delta compiler over it and pushes the generated mapping /
# schema / manifest / query edits back to the same branch. Two reasons it is
# a workflow and not the service:
#
#   - the compiler stays the SINGLE writer of runtime artifacts (ADR-0006):
#     the reviewer sees the intent (the envelope) and the generated diff in
#     one PR, and no browser-side code ever authors an artifact;
#   - a compile failure fails THIS check on the PR, which is exactly where
#     the reviewer looks — not a 500 in a service the author cannot read.
#
# CREDENTIAL — deliberately NOT the workflow's own GITHUB_TOKEN. Pushes made
# with GITHUB_TOKEN do not trigger other workflows, so the PR's required
# checks (commit identity, PR lint, smart-commit, product CI) would never run
# against the compile commit and the PR would sit unmergeable at "Expected —
# waiting for status". INTAKE_COMPILE_TOKEN is the same fine-grained PAT the
# submission service holds (contents + pull requests on this repository),
# stored a second time as an Actions secret. Because a PAT push DOES trigger
# workflows, the [intake-compile] marker guard below is what breaks the loop:
# this workflow's own push re-fires it, and the marker makes that run a no-op.
#
# The artifact commit is authored by the same engineer who authored the
# envelope commit (read from git, not invented): .githooks/lint-identity.sh
# runs on every PR and refuses bot authors, and Jira silently discards Smart
# Commits from unmatched addresses. The compiler is credited in the trailer.

on:
  push:
    branches: ["intake/UIFPE-*"]

permissions:
  contents: read

concurrency:
  group: intake-compile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile intake artifacts
    # the loop-breaker: this job's own PAT push re-triggers the workflow,
    # and the marker in that commit's subject makes the re-run a no-op
    if: ${{ !contains(github.event.head_commit.message, '[intake-compile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run without the push credential
        env:
          HAS_TOKEN: ${{ secrets.INTAKE_COMPILE_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::INTAKE_COMPILE_TOKEN is not set. Pushing with the" \
              "default GITHUB_TOKEN would suppress the PR's required checks" \
              "on the compile commit (GitHub does not trigger workflows from" \
              "GITHUB_TOKEN pushes), leaving the submission unmergeable." \
              "Store the submission service's fine-grained PAT as an Actions" \
              "secret named INTAKE_COMPILE_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.INTAKE_COMPILE_TOKEN }}

      # Cheap detection FIRST: the branch-creation push (the service creates
      # the ref at develop's tip before adding the envelope commit) must not
      # cost a pip install and a full test suite to discover it has nothing
      # to do. --diff-filter=AM: an envelope deleted on the branch is not an
      # instruction to compile a file that no longer exists.
      - name: Find the submitted envelopes
        id: detect
        run: |
          set -euo pipefail
          git fetch origin develop --quiet
          FILES=$(git diff --name-only --diff-filter=AM origin/develop...HEAD \
            -- 'domains/product/src/schemas/intake/submitted/*.json' || true)
          if [ -z "$FILES" ]; then
            echo "No submitted envelopes on this branch — nothing to compile."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "$FILES"
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf 'files<<EOF\n%s\nEOF\n' "$FILES" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.any == 'true'
        with:
          python-version: "3.11"

      - name: Install QE dependencies
        if: steps.detect.outputs.any == 'true'
        run: pip install -r domains/product/qe/requirements-dev.txt

      - name: Compile the submitted envelopes
        if: steps.detect.outputs.any == 'true'
        env:
          FILES: ${{ steps.detect.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "═══ compiling $f ═══"
            python stacks/echo/src/apps/cli/compile_intake_delta.py \
              --intake "$f" --apply
          done <<< "$FILES"

      - name: Run the parity gates on the compiled result
        if: steps.detect.outputs.any == 'true'
        run: python -m pytest domains/product/qe stacks/echo/qe/gold -q

      - name: Push the generated artifacts
        if: steps.detect.outputs.any == 'true'
        run: |
          set -euo pipefail
          git add -A domains/
          if git diff --cached --quiet; then
            echo "Compiler produced no changes — envelope already applied."
            exit 0
          fi
          # the engineer who submitted authors this commit too — never a bot
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          git config user.name  "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          KEY=$(echo "$GITHUB_REF_NAME" | grep -oE 'UIFPE-[0-9]+' || true)
          git commit \
            -m "${KEY:-UIFPE-218} #comment compile the submitted intake into runtime artifacts [intake-compile]" \
            -m "Generated by the delta compiler from the envelope on this branch — the compiler is the only writer of mapping, schema, manifest and query artifacts; nothing here was authored by hand." \
            -m "Co-Authored-By: UIF delta compiler <noreply@pearson.com>"
          git push
