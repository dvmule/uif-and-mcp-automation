name: Deploy program — Dev

# Program's dev deploy. A REDUCED copy of deploy-product-dev.yml, and the
# reductions are the interesting part — see "What program does NOT do" below.
#
# Branch → environment contract (ADR-0004): develop → dev. UAT and PROD are
# deliberately absent, not forgotten: their Terraform backends are still
# `UPDATE-ME-` placeholders, only `overlays/dev` exists for program, and the
# §CP-5 cutover has not run for those envs. Add them when those three are true.

on:
  push:
    branches: [develop]
    paths:
      - "domains/program/**"
      - ".github/workflows/deploy-program-dev.yml"
  workflow_dispatch:

# SEPARATE concurrency group from product's, which is a real trade-off rather
# than a copy-paste artefact. Per-domain groups mean the two domains' deploys can
# run CONCURRENTLY, and they share one DynamoDB config table and one pair of Glue
# jobs. The version-skew hazard product's CLAUDE.md warns about (an old dispatcher
# feeding the lean glue block to whatever runs next) is therefore possible across
# domains, not just within one.
#
# Sanctioned by the UIFPE-122 steward-model decision
# (capabilities/data/gold-control-plane.md §2) because program does not deploy
# Terraform or Glue scripts (see below) — it only writes artifacts under its OWN
# entity prefix and its own config item, so there is nothing for it to skew.
# THE MOMENT program deploys the dispatcher or the shared jobs, this must become
# a shared gate (`group: deploy-gold-dev`) or the two will race — the standard
# carries that condition (first recorded on UIFPE-121).
concurrency:
  group: deploy-program-dev
  cancel-in-progress: false

jobs:
  # Latch, per-domain by design: the existing rename comment in product's
  # workflows states the variable is deliberately scoped per domain, so program
  # gets PROGRAM_DEPLOY_ENABLED rather than riding on product's. That is what lets
  # program's first load be enabled without touching a live pipeline.
  #
  # Skips with a notice rather than failing red, matching product's dev workflow:
  # a standing red X on develop teaches people to ignore red.
  latched:
    name: Deploy program latched off
    if: github.ref == 'refs/heads/develop' && vars.PROGRAM_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Program dev deploy skipped — PROGRAM_DEPLOY_ENABLED != 'true'. Set the repo variable PROGRAM_DEPLOY_ENABLED=true once the UIFPE-121 platform confirmations are in (glue role SELECT on mtl_related_items + fnd_lookup_values_vl, create/write on uif_echo_dev_gold_program and s3://uif-echo-dev-gold/program/*)."

  deploy:
    name: Deploy program to dev
    if: github.ref == 'refs/heads/develop' && vars.PROGRAM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install boto3 pyyaml jsonschema sqlparse
          pip install -r domains/program/qe/requirements-dev.txt

      # Test gate BEFORE any credential is assumed. Program's 41 domain-local
      # gates plus the shared, fail-closed artifact validation — the same script
      # product's workflow calls, so a drifted manifest cannot reach S3.
      - name: Test gate
        run: |
          python3 -m pytest domains/program/qe -q
          python3 stacks/echo/src/apps/cli/validate_gold_schemas.py --domain program

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1

      # PER-ENTITY --delete, never the shared prefix (UIFPE-117). The destination
      # is shared by every gold domain, so syncing domain-wide with --delete would
      # purge another domain's artifacts and its transform would then fail at
      # artifact load with no clear cause. Looping keeps --delete's stale-file
      # cleanup inside each entity's own subtree.
      - name: Sync schema + mapping artifacts
        run: |
          for d in domains/program/src/schemas/gold/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/schemas/gold/$entity" --delete
          done
          for d in domains/program/src/schemas/mapping/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/mappings/$entity" --delete
          done

      # Config-as-code -> DynamoDB. KNOWN NOISE (UIFPE-121 open item): one run
      # covers ONE domain's pipelines directory while the config table is SHARED,
      # so this run lists product's pipelines as UNMANAGED and product's run lists
      # program's. Noise, not damage — sync never deletes unmanaged items — but a
      # log that cries UNMANAGED on every deploy is a log people stop reading.
      # --repo-root (used below) scopes the read, not the scan; the fix is to teach
      # sync to accept several pipeline dirs in one pass.
      - name: Sync pipeline configs (config-as-code)
        run: |
          # --repo-root, NOT a --pipelines-dir flag (there is no such flag):
          # the script locates pipelines/base/ relative to this root, which for
          # a domain is <domain>/src/apps. Verified: load_desired('dev',
          # domains/program/src/apps) discovers ['program'].
          python3 stacks/echo/src/apps/cli/sync_pipelines.py \
            --env "$ENV" --repo-root domains/program/src/apps --apply

      - name: Summary
        run: |
          echo "::notice::Program artifacts + pipeline config deployed to $ENV. The first transform run performs the FULL LOAD (dispatcher-detected via target-table absence, glue.full_load profile). Run the UIFPE-121 A1-A8 acceptance checks against it before closing the story — a green run is not evidence the DATA is right."

# ── What program does NOT do, and why ────────────────────────────────────────
# (the rule for every non-product gold domain — UIFPE-122,
#  capabilities/data/gold-control-plane.md §2–3)
#
# NO `terraform apply`. Program owns no infrastructure: it reuses the shared gold
# stack (Glue jobs, dispatcher, config table, buckets) which lives in
# domains/product/infrastructure/terraform/ and is applied by product's dev
# deploy. Adding a second apply against the same state would have two workflows
# racing one Terraform lock. If program ever needs its own resources, the state
# ownership question in UIFPE-116 open decision 1 has to be settled first.
#
# NO Glue script upload. The transform and reconcile jobs are entity-agnostic and
# driven entirely by `--gold_id` config; the copies already in
# s3://uif-echo-{env}-data/code/gold/ serve program unchanged. Uploading
# them again from here would mean two domains writing the same objects.
#
# NO UI build. The Transform UI is product's; program's mappings are authored
# through it, and it deploys with product.
#
# NO registry publish. Program's master.json is `lifecycle: draft` and publishing
# is blocked on a service URN + PUBLISH_API_BASE that do not exist yet.
