name: Smart Commit

# Every commit is a Smart Commit. Traceability is the point of the model —
# JPD Initiative → Capability → Epic → Story → the commit that implements it —
# and a commit with no issue key breaks the chain at its last link. The Jira
# issue then shows a status with no evidence behind it, and the only record of
# what actually changed lives in git where the PM and QE Lead never look.
#
# Two things are required on every non-merge commit:
#
#   UIFPE-<n>              the issue key, so the commit attaches to the work
#   #comment <text>        a clear description, visible ON the issue
#
# The rule is defined once in .githooks/lint-commits.sh and enforced three
# times: the commit-msg hook refuses the message as written, the pre-push hook
# refuses the push, and this workflow fails the pull request. CI is the
# backstop, not the first line — a hook only runs on a machine that has it
# configured, and --no-verify bypasses it.
#
# Convention and token table: capabilities/delivery/jira-github-integration.md

on:
  pull_request:

permissions:
  contents: read

jobs:
  smart-commit:
    name: Every commit carries a Jira key and a comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .githooks/lint-commits.sh --range "$BASE_SHA..$HEAD_SHA"
