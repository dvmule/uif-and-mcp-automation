name: Deploy product — Dev

# Branch → environment contract (ADR-0004 / branching model):
#   development → dev, uat
#   main        → uat, prod
# Dev deploys automatically on every push to development.

on:
  push:
    branches: [develop]
    paths:
      - "domains/product/**"
      # Shared runtime code the marketing-copy api zip copies in
      # (platform/python/README.md). That zip is built by archive_file at
      # PLAN time, so without this a change to the shared module alone
      # merges without rebuilding the zip that carries it.
      - "platform/python/**"
      - ".github/workflows/deploy-product-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-product-dev
  cancel-in-progress: false

jobs:
  # Cutover safety latch (ADR-0004 §CP-5): gold infra/configs are still owned
  # by the platform stack until the cutover completes. The latch is the
  # repository variable PRODUCT_DEPLOY_ENABLED (renamed from the source repo's
  # DEPLOY_ENABLED — scoped per-domain in the monorepo). Unset (the default)
  # evaluates to != 'true', so deploys fail closed.
  #
  # This auto-triggered workflow SKIPS (neutral, with a notice) when latched,
  # instead of failing red on every product merge — a standing red X on
  # develop teaches people to ignore red. The manually-dispatched uat and
  # prod workflows keep the loud exit-1 latch: there an operator explicitly
  # asked for a deploy and must be told why nothing happened.
  latched:
    name: Deploy product latched off
    if: github.ref == 'refs/heads/develop' && vars.PRODUCT_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Dev deploy skipped — PRODUCT_DEPLOY_ENABLED != 'true'. Complete the ADR-0004 §CP-5 cutover, then set the repo variable PRODUCT_DEPLOY_ENABLED=true to enable automatic dev deploys."

  deploy:
    name: Deploy product to dev
    # Guard: dev only ever deploys from develop, and only once the cutover
    # latch is open.
    if: github.ref == 'refs/heads/develop' && vars.PRODUCT_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Test gate
        run: |
          pip install -r domains/product/qe/requirements-dev.txt
          python -m pytest domains/product/qe -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3

      # Product's slice of the EVENT PIPELINE — its bus/DLQ (event-domain
      # module instance), mapping/seed uploads and the pipeline-configs seed
      # row — is part of the Terraform apply below
      # (infrastructure/terraform/product_events.tf). The SHARED eventing
      # platform (controller, publish Glue job, provisioner, DLQ recorder,
      # tables) deploys from stacks/event via deploy-event-dev.yml
      # (UIFPE-184 stack split; migration order in stacks/event/MIGRATION.md).
      # One-time prereq per account: Lake Formation grants to the shared
      # publish + controller roles on this domain's gold database.
      - name: Terraform apply
        working-directory: domains/product/infrastructure/terraform
        run: |
          make init ENV=$ENV
          make plan ENV=$ENV
          make apply ENV=$ENV

      # UIFPE-117: --delete is scoped PER ENTITY, never to the shared prefix.
      # The source dir is this domain's; the destination prefix is shared by
      # every gold domain — so syncing domain-wide with --delete would purge
      # another domain's artifacts (e.g. program's schemas/gold/program/v1/),
      # and its transform would then fail at artifact load with no clear
      # cause. Looping keeps --delete's stale-file cleanup inside each
      # entity's own subtree and still handles a domain gaining entities.
      - name: Sync schema + mapping artifacts
        run: |
          for d in domains/product/src/schemas/gold/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/schemas/gold/$entity" --delete
          done
          for d in domains/product/src/schemas/mapping/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/mappings/$entity" --delete --exclude "*.mapping.json"
          done

      - name: Sync pipeline configs (config-as-code)
        run: python stacks/echo/src/apps/cli/sync_pipelines.py --env $ENV --apply

