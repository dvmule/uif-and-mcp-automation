name: Subject Naming

# Three subject conventions grew in this repository because nothing compared
# them — the same root cause ADR-0014 recorded for the naming-rule drift. This
# job is that comparison, and it is the STRICT half of a deliberate split: the
# server rule in metadata_validator.py can only judge a subject whose type slot
# is one of the five tokens, because the live registry holds artifacts governed
# by other standards. This knows the full allowlist, so it can be strict.
#
# Separate from standards-ci.yml rather than a second job in it: GitHub filters
# paths per workflow, not per job, so sharing a file would run the naming-rule
# guard on every domain pull request as well.

on:
  pull_request:
    paths:
      - 'domains/**'
      - 'stacks/apicurio/standards/**'
      - 'stacks/apicurio/src/app/services/metadata_validator.py'
      - 'stacks/echo/src/apps/cli/generate_tier_subsets.py'
      - '.github/workflows/subject-naming-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'domains/**'
      - 'stacks/apicurio/standards/**'
      - 'stacks/apicurio/src/app/services/metadata_validator.py'
      - 'stacks/echo/src/apps/cli/generate_tier_subsets.py'
      - '.github/workflows/subject-naming-ci.yml'

permissions:
  contents: read

jobs:
  subject-guard:
    name: Every registry coordinate conforms or is listed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyyaml is not optional here: four coordinates are declared as YAML
      # x-registry blocks, and the test refuses to run without it rather than
      # skipping and reporting a green it has not earned.
      - name: Install pytest and pyyaml
        run: python -m pip install --quiet pytest pyyaml

      # The whole standards directory, not one named file. A second guard
      # (test_step2_naming.py) was invisible to CI for as long as this step
      # named a single file, which is the same failure mode the guards
      # themselves exist to catch: a rule that runs nowhere.
      - name: Coordinates conform to ADR-0023 and to the step-2 naming rule
        run: python -m pytest stacks/apicurio/standards/ -v
