openapi: 3.1.0
info:
  title: Product Developer Registration API
  version: 1.0.0
  description: >
    Registers third-party developers onto the product platform and manages their
    lifecycle. This is the runnable reference for the UIF API capability: it
    implements every rule in `capabilities/api/guidelines.md` — naming, contract,
    testing, security, and observability — so any engineer can copy the pattern.
  contact:
    name: UIF Platform
    url: https://github.com/pearson-dnt-coe/universal-Integration-framework
  license:
    name: Proprietary
servers:
  - url: https://api.product.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local

tags:
  - name: developers
    description: Developer registration and lifecycle.

security:
  - bearerAuth: []

paths:
  /developers:
    get:
      operationId: listDevelopers
      summary: List developers
      description: Returns a page of registered developers, newest first.
      tags: [developers]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of developers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperPage'
              example:
                items:
                  - id: dev_01HZX3
                    email: ada@example.com
                    displayName: Ada Lovelace
                    status: active
                    createdAt: '2026-07-24T09:00:00Z'
                nextCursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: registerDeveloper
      summary: Register a developer
      description: >
        Registers a new developer. The email must be unique. Send an
        `Idempotency-Key` header to make retries safe.
      tags: [developers]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeveloperRequest'
            example:
              email: ada@example.com
              displayName: Ada Lovelace
      responses:
        '201':
          description: Developer registered.
          headers:
            Location:
              description: URL of the created developer.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Developer'
              example:
                id: dev_01HZX3
                email: ada@example.com
                displayName: Ada Lovelace
                status: active
                createdAt: '2026-07-24T09:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /developers/{developerId}:
    parameters:
      - $ref: '#/components/parameters/DeveloperId'
    get:
      operationId: getDeveloper
      summary: Get a developer
      description: Returns a single developer by id.
      tags: [developers]
      responses:
        '200':
          description: The developer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Developer'
              example:
                id: dev_01HZX3
                email: ada@example.com
                displayName: Ada Lovelace
                status: active
                createdAt: '2026-07-24T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.1 / OIDC bearer token. Every operation requires it.

  parameters:
    DeveloperId:
      name: developerId
      in: path
      required: true
      description: Opaque developer identifier.
      schema: { type: string }
      example: dev_01HZX3
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum items per page (1–100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key that makes a retried POST safe.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request failed validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.product.example.com/problems/validation-error
            title: Validation failed
            status: 400
            detail: 'email must be a valid email address'
            instance: /api/v1/developers
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.product.example.com/problems/unauthorized
            title: Unauthorized
            status: 401
            detail: 'A valid bearer token is required'
            instance: /api/v1/developers
    NotFound:
      description: No such developer.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.product.example.com/problems/not-found
            title: Developer not found
            status: 404
            detail: 'No developer with id dev_missing'
            instance: /api/v1/developers/dev_missing
    Conflict:
      description: A developer with that email already exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.product.example.com/problems/email-taken
            title: Email already registered
            status: 409
            detail: 'A developer with email ada@example.com already exists'
            instance: /api/v1/developers
    ServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.product.example.com/problems/internal
            title: Internal server error
            status: 500
            detail: 'An unexpected error occurred'
            instance: /api/v1/developers

  schemas:
    RegisterDeveloperRequest:
      type: object
      additionalProperties: false
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Unique contact email for the developer.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Human-readable name shown in the console.

    Developer:
      type: object
      additionalProperties: false
      required: [id, email, displayName, status, createdAt]
      properties:
        id:
          type: string
          description: Opaque developer identifier.
        email:
          type: string
          format: email
        displayName:
          type: string
        status:
          type: string
          enum: [active, suspended]
          description: Lifecycle state of the developer.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC timestamp of registration.

    DeveloperPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Developer' }
        nextCursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.

    Problem:
      type: object
      description: RFC 7807 problem details. The single error shape for the whole API.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Stable documentation URL for this error class.
        title:
          type: string
          description: Short, human-readable summary; stable per error class.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying the specific occurrence.
