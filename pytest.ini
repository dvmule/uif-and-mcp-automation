# pytest.ini — repo-wide pytest configuration (UIFPE-152).
#
# Why this file exists: under pytest's default (prepend) import mode, test
# modules import by BARE BASENAME into one flat namespace, so two domains
# carrying the same ported gate filename (test_intake_hygiene.py,
# test_gold_mapping_intake_parity.py, test_event_schemas.py — in product AND
# program) cannot be collected in ONE invocation: the second file collides
# with the first and collection aborts. importlib mode gives every test file
# a unique module identity instead, so
#   py -m pytest domains/product/qe domains/program/qe
# (and any future all-domains run) collects cleanly, per-domain and
# single-file runs are unchanged, and a ninth domain copying the gates never
# needs renamed files or __init__.py packages.
#
# Scope note: this is a repo-level TOOL config, not a domain-root packaging
# file (those remain blocked on a framework decision — see product's
# CLAUDE.md "No pyproject.toml"). Each domain's qe/conftest.py stays the only
# sys.path authority for its suite, and `py -m unittest` is unaffected —
# unittest never reads this file.

[pytest]
addopts = --import-mode=importlib
