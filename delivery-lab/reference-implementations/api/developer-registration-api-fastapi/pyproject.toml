[project]
name = "product-developer-registration-api"
version = "1.0.0"
description = "UIF reference API (FastAPI) — implements capabilities/api/guidelines.md end to end."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.22",
    "referencing>=0.35",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# UP045 (`X | None`) is evaluated by Pydantic at runtime and fails on 3.9; keep Optional[...].
ignore = ["UP045"]
