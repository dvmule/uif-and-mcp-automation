[pytest]
# --import-mode=importlib is inherited in spirit from the repo-root pytest.ini
# (UIFPE-152) but must be restated: pytest reads exactly ONE inifile, the
# nearest one, so anything omitted here is simply not set for this suite.
addopts = --import-mode=importlib
asyncio_mode = auto
testpaths = qe/tests
markers =
    integration: tests that require a live environment (set RUN_INTEGRATION_TESTS=1)
    requires_seed: needs a POPULATED registry -- deselect with -m "not requires_seed".
        A freshly deployed registry is legitimately empty, so these assertions are
        correct about a seeded environment and wrong about a new one. The deploy
        smoke job (tier 2) deselects them; tier 3 runs them after seeding.
        DEPLOY-DEV.md Phase 5.
