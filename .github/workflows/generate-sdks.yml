name: Generate SDKs

# SDK/type generation from registered Apicurio contracts
# (stacks/apicurio/standards/apicurio-governance.md §5). Generated clients are
# fetched fresh from Apicurio on every run — never from the PR's local
# file — and are published ONLY as CI build artifacts, never committed
# into a domain (the lesson already learned from
# domains/product/infrastructure/terraform/product_events_clients.generated.tf,
# which needs its own drift-check to stay honest as a committed generated
# file). No-ops entirely if APICURIO_REGISTRY_URL isn't provisioned yet.

on:
  push:
    branches: [main]
    paths:
      - 'domains/*/src/api/**'
      - 'domains/*/src/events/**'
  workflow_dispatch:
    inputs:
      group:
        description: Apicurio artifact group (the owning domain)
        required: true
      artifact:
        description: Apicurio artifact id
        required: true

permissions:
  contents: read

env:
  TOOLING_DIR: delivery-lab/reference-implementations/schema-governance

jobs:
  generate:
    if: vars.APICURIO_REGISTRY_URL != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, java, python]
    name: generate (${{ matrix.language }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.TOOLING_DIR }}/requirements.txt

      - run: pip install -r ${{ env.TOOLING_DIR }}/requirements.txt

      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate client
        env:
          APICURIO_REGISTRY_URL: ${{ vars.APICURIO_REGISTRY_URL }}
        run: |
          set -euo pipefail
          GROUP="${{ inputs.group }}"
          ARTIFACT="${{ inputs.artifact }}"
          if [ -z "$GROUP" ] || [ -z "$ARTIFACT" ]; then
            echo "no group/artifact given (push trigger, not workflow_dispatch) — nothing to generate yet; wire this up to detect_changed_contracts.py's output once the registry is live"
            exit 0
          fi
          cd "$TOOLING_DIR/scripts"
          python generate_sdk.py \
            --group "$GROUP" --artifact "$ARTIFACT" \
            --language "${{ matrix.language }}" \
            --out-dir "$GITHUB_WORKSPACE/generated/${{ matrix.language }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-${{ matrix.language }}-${{ github.sha }}
          path: generated/${{ matrix.language }}
          if-no-files-found: ignore
          retention-days: 14
