name: Workflow lint

# The gate that would have caught the two outages nobody noticed.
#
# A broken workflow file does not fail like a test. It fails at STARTUP, with
# no jobs and therefore no job logs -- `gh run view` says only "This run likely
# failed because of a workflow file issue", and `--log-failed` answers "log not
# found". Nothing surfaces it unless a person opens the run and reads the
# banner. Two workflows in this repository died exactly that way:
#
#   stacks-ci.yml        39 consecutive startup failures, 2026-09-15 -> 09-18,
#                        from one `terraform-linters/setup-tflint@v4` reference
#                        the enterprise Actions policy refuses. The stack test
#                        gate, SCA, SAST and SIF checks all silently stopped
#                        running for three days. Fixed in #358.
#   standards-review.yml Failed at startup on EVERY run it ever had -- 29
#                        failures, 2026-08-25 to 08-28 -- for TWO causes, one
#                        per check below -- and was then `disabled_manually`
#                        rather than fixed, so 129 commits touching domains/**
#                        went by with none of the advisory review it existed
#                        to give. DELETED in this same change: its only real
#                        step needed an action the enterprise policy refuses
#                        and an API key the org had already decided not to
#                        provision.
#
# The two cases differ, and the distinction is the point. stacks-ci.yml went
# unnoticed outright: nothing in this repository validates a workflow file, and
# no workflow-file change is gated -- #364 changed deploy logic and ran only the
# four commit/PR paperwork checks. standards-review.yml WAS noticed, by a human
# who disabled it; what failed there was the repair. #124 has been open three
# weeks and cannot work, because it keeps `secrets` in a step-level `if`, which
# is one of the two original causes. So this gate buys detection in the first
# case and a correct review in the second -- it would have failed #124.
#
# TWO CHECKS, deliberately narrow so this can be blocking from day one rather
# than accumulating a backlog first. Measured before writing it: actionlint
# reports exactly ONE finding across all 28 workflows, and that one is a live
# bug, not style noise.
#
# This workflow uses `actions/checkout` and nothing else, on purpose: a lint
# gate that cannot start is worse than none, and actions/* is GitHub-created so
# it is permitted under every branch of the policy below.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned binary with a verified checksum -- the same shape as the tflint
      # and hadolint installs in stacks-ci.yml, and for the same reason: it
      # keeps this gate independent of the very allow-list it exists to police.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          tar="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${tar}"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # -shellcheck= and -pyflakes= are OFF deliberately, and this is the one
      # knob worth revisiting later. actionlint can shell-check every `run:`
      # block, which is valuable but would report a backlog across 28 files and
      # make this gate impossible to land blocking. Workflow-level correctness
      # -- invalid contexts, bad expressions, undefined `needs` -- is what
      # actually causes startup failures, and that is what stays on here.
      #
      # EVERY workflow is linted, with no exclusions. The one file that needed
      # excluding when this gate was written -- standards-review.yml, which
      # carried the single finding across all 28 workflows -- has been deleted,
      # so the gate covers the whole directory. Keep it that way: an exclusion
      # list is how a linter stops meaning anything.
      - name: actionlint
        run: |
          set -euo pipefail
          # Piped into xargs rather than word-splitting a variable: the latter
          # works in bash and silently passes one giant filename in shells that
          # do not split, which is how this step failed when it was first
          # tested locally.
          ls .github/workflows/*.yml | tee /dev/stderr \
            | xargs actionlint -shellcheck= -pyflakes=

      # The check that would have prevented the three-day outage.
      #
      # The enterprise Actions policy admits an action only if it is owned by
      # the enterprise, created by GitHub, verified in the Marketplace, or
      # matches an allow-list pattern. A reference outside that set fails the
      # WHOLE workflow at startup -- not the step -- which is why one bad line
      # took six jobs down with it.
      #
      # The policy is set at org/enterprise level and CANNOT be changed from
      # this repository: `PUT /repos/.../actions/permissions/selected-actions`
      # answers 409 Conflict. So adding an owner here is not self-service -- it
      # needs evidence the action is genuinely permitted, which in practice
      # means a green run of it somewhere in this org.
      - name: Every `uses:` must be permitted by the enterprise Actions policy
        run: |
          set -euo pipefail

          # Owner-level allow-list. Every entry carries the evidence that put
          # it here, so the next person does not have to re-derive it.
          #   actions, github   GitHub-created.
          #   pearson*          Enterprise-owned. This is why
          #                     pearson-adm-gitworks/action-security-scan needs
          #                     no allow-list entry and runs green in
          #                     finance-meridian.
          #   hashicorp         Marketplace-verified; green in
          #                     finance-meridian/infra-plan.yml.
          #   aws-actions       Marketplace-verified; green here since before
          #                     the outage.
          #   aquasecurity      Marketplace-verified; green in this repo's own
          #                     deploy-apicurio-dev.yml bff-image job.
          #   sonarsource,      Named in the org allow-list patterns
          #   opentofu          (read 2026-09-18).
          allowed_owners="actions github hashicorp aws-actions aquasecurity sonarsource opentofu"

          # There is no known-violation list, deliberately. This gate shipped
          # with exactly one entry -- anthropics/claude-code-action in
          # standards-review.yml -- and that workflow is deleted in the same
          # change, so the list emptied and the mechanism goes with it rather
          # than remaining as an empty hook inviting the next exception. If a
          # violation ever genuinely has to be tolerated for a period,
          # validate-sif's KNOWN_VIOLATIONS block in stacks-ci.yml is the
          # precedent: named entries, each with a reason and a removal
          # condition.

          violations=""
          for f in .github/workflows/*.yml; do
            # Position-aware on purpose: a naive grep for "uses:" also matches
            # PROSE INSIDE COMMENTS -- several comments in this repo discuss
            # `uses:` lines, including the ones explaining this very policy --
            # so only real YAML keys are considered and comment lines dropped.
            refs=$(grep -hE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]]' "$f" \
                   | grep -vE '^[[:space:]]*#' \
                   | sed -E 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*//' \
                   | sed 's/[[:space:]]*#.*//' || true)
            for ref in $refs; do
              case "$ref" in
                ./*) continue ;;                      # local action or reusable workflow
              esac
              repo="${ref%%@*}"
              owner="${repo%%/*}"
              case "$owner" in pearson*) echo "ok     $f: $ref (enterprise-owned)"; continue ;; esac
              case " $allowed_owners " in
                *" $owner "*) echo "ok     $f: $ref" ;;
                *) echo "DENIED $f: $ref"; violations="$violations $f:$ref" ;;
              esac
            done
          done

          if [ -n "$violations" ]; then
            echo "::error::These actions are not permitted by the enterprise Actions policy, and referencing one fails the ENTIRE workflow at startup — with no job logs to diagnose it from:$violations. The policy admits only actions owned by the enterprise, created by GitHub, verified in the Marketplace, or matching an org allow-list pattern, and it cannot be changed from this repository (the API answers 409). Either prove the action is permitted — a green run of it elsewhere in this org is the practical test — and add its owner to allowed_owners in this file with that evidence, or install the tool as a pinned, checksum-verified binary instead, the way stacks-ci.yml installs tflint and hadolint."
            exit 1
          fi
          echo "::notice::Every action reference is permitted by the enterprise Actions policy."
