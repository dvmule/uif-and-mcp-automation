name: Gold Schemas (price) — Validate

# Trigger paths only. The body is in gold-schemas.yml.
#
# Before this file, price's gold master was validated ONLY by
# deploy-price-dev.yml, which runs on push to develop - so a malformed master
# merged and the deploy was what failed, after the fact. Price does not publish:
# a service URN does not exist for it yet.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "domains/price/src/schemas/**"
      - "domains/price/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/price-gold-schemas.yml"
  push:
    branches: [main, develop]
    paths:
      - "domains/price/src/schemas/**"
      - "domains/price/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/price-gold-schemas.yml"

jobs:
  gold-schemas:
    uses: ./.github/workflows/gold-schemas.yml
    with:
      domain: price
