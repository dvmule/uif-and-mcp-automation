name: Product CI

on:
  push:
    # main included so the merged state (post-PR-merge) is tested too, not
    # just the pre-merge development branch.
    branches: [develop, main]
    paths:
      - "domains/product/**"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths:
      - "domains/product/**"
      - ".github/workflows/product-ci.yml"

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r domains/product/qe/requirements-dev.txt
      - name: Run tests
        run: python -m pytest domains/product/qe -v

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt check
        run: terraform fmt -check -recursive domains/product/infrastructure/terraform
      - name: validate
        working-directory: domains/product/infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate
