name: Gold Schemas — Validate & Publish

# Trigger paths and the publish decision. The body is in gold-schemas.yml.
#
# Publish is a prod-release action in the branching model (develop = dev/uat,
# main = prod version), and it stays behind the PRODUCT_DEPLOY_ENABLED latch so
# exactly one repository publishes during the ADR-0004 CP-5 cutover window.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "domains/product/src/schemas/**"
      - "domains/product/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/product-gold-schemas.yml"
  push:
    branches: [main, develop]
    paths:
      - "domains/product/src/schemas/**"
      - "domains/product/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/product-gold-schemas.yml"

jobs:
  gold-schemas:
    uses: ./.github/workflows/gold-schemas.yml
    with:
      domain: product
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCT_DEPLOY_ENABLED == 'true' }}
