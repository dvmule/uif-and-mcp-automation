name: Deploy event stack — Dev

# The shared eventing platform (stacks/event): pipeline controller, publish
# Glue job, subscription provisioner, DLQ recorder, the six shared DynamoDB
# tables and the GoldMergeCompleted trigger. Deploys with the same OIDC role
# the product domain uses (AWS_ROLE_ARN_DEV, environment: dev).
#
# Latch: repo variable EVENT_DEPLOY_ENABLED — unset fails CLOSED (tests
# still run; the apply is skipped with a notice). Keep it off during the
# UIFPE-184 state migration until the domain apply has landed first
# (stacks/event/MIGRATION.md).
#
# The TEST GATE runs on every push touching stacks/event/** regardless of
# the latch — the latch only decides whether Terraform applies afterwards.
#
# RELEASE ARTIFACTS (docs/uif-event-uat-rollout-plan.md, Phase 1). The root no
# longer zips anything at plan time: every Lambda and Glue script is read from
# uif-event-dev-release-artifacts at a content-hashed key. This workflow
# stages them from source first (scripts/stage-release-artifacts.sh -- dev is the only
# environment that builds), and on the very first apply creates that bucket
# with a targeted apply before staging into it.

on:
  push:
    branches: [develop]
    paths:
      - "stacks/event/**"
      - ".github/workflows/deploy-event-dev.yml"
  workflow_dispatch:
    inputs:
      infra:
        description: "Terraform action for the event stack"
        type: choice
        options: [plan, apply, skip]
        default: plan

concurrency:
  group: deploy-event-dev
  cancel-in-progress: false

env:
  ENV: dev
  AWS_REGION: eu-west-1

jobs:
  test:
    name: Unit tests (event stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install boto3 botocore pytest -r stacks/event/qe/requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest stacks/event/qe -q

  deploy:
    name: Terraform (event stack, dev)
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Resolve action
        id: act
        run: |
          ACTION="${{ github.event_name == 'workflow_dispatch' && inputs.infra || (vars.EVENT_DEPLOY_ENABLED == 'true' && 'apply' || 'skip') }}"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          if [ "$ACTION" = "skip" ]; then
            echo "::notice::Event stack deploy skipped — EVENT_DEPLOY_ENABLED != 'true' and no dispatch input. Tests already ran."
          fi

      - uses: actions/checkout@v4
        if: steps.act.outputs.action != 'skip'

      - name: Configure AWS credentials (OIDC)
        if: steps.act.outputs.action != 'skip'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        if: steps.act.outputs.action != 'skip'
        with:
          # Pinned, as echo and apicurio pin it: a saved plan is only valid
          # for the Terraform version that wrote it.
          terraform_version: 1.15.8

      - uses: actions/setup-python@v5
        if: steps.act.outputs.action != 'skip'
        with:
          python-version: "3.12"

      - name: Terraform init
        if: steps.act.outputs.action != 'skip'
        working-directory: stacks/event/infrastructure/terraform
        run: terraform init -reconfigure -backend-config=backends/$ENV.s3.tfbackend

      # The root reads every Lambda zip and Glue script from the release
      # bucket (release.tf), and staging uploads into it BEFORE the plan -- so
      # the bucket has to exist first. On the one run where it does not:
      #   apply -> create it alone with a targeted apply (echo's step 4.5);
      #   plan  -> create nothing; stage with --hash-only below, so the plan
      #            can still be read before anything is applied.
      - name: Release bucket (first run only)
        id: bucket
        if: steps.act.outputs.action != 'skip'
        working-directory: stacks/event/infrastructure/terraform
        env:
          ACTION: ${{ steps.act.outputs.action }}
        run: |
          set -euo pipefail
          bucket="uif-event-${ENV}-release-artifacts"
          if aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTION" != "apply" ]; then
            echo "::notice::${bucket} does not exist yet. Planning with hash-only staging; the apply creates it first."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::Creating ${bucket} (targeted apply, first run only)."
          terraform apply -auto-approve -input=false -var-file=envs/$ENV.tfvars \
            -target=aws_s3_bucket.release_artifacts \
            -target=aws_s3_bucket_versioning.release_artifacts \
            -target=aws_s3_bucket_public_access_block.release_artifacts \
            -target=aws_s3_bucket_server_side_encryption_configuration.release_artifacts
          echo "exists=true" >> "$GITHUB_OUTPUT"

      # ONE script defines the artifact set; release-event.yml calls the same
      # one, so a dev apply and a build tag cannot disagree about it.
      - name: Stage release artifacts
        if: steps.act.outputs.action != 'skip'
        env:
          EXISTS: ${{ steps.bucket.outputs.exists }}
        run: |
          set -euo pipefail
          out=stacks/event/infrastructure/terraform/artifacts.auto.tfvars.json
          if [ "$EXISTS" = "true" ]; then
            bash stacks/event/scripts/stage-release-artifacts.sh \
              --bucket "uif-event-${ENV}-release-artifacts" --tfvars "$out"
          else
            bash stacks/event/scripts/stage-release-artifacts.sh --hash-only --tfvars "$out"
          fi
          cat "$out"

      - name: Terraform plan
        if: steps.act.outputs.action != 'skip'
        working-directory: stacks/event/infrastructure/terraform
        run: terraform plan -var-file=envs/$ENV.tfvars -out=$ENV.tfplan

      - name: Terraform apply
        if: steps.act.outputs.action == 'apply'
        working-directory: stacks/event/infrastructure/terraform
        run: terraform apply $ENV.tfplan
