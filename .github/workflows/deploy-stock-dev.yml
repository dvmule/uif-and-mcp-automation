name: Deploy stock — Dev

# Stock's dev deploy — a REDUCED copy of deploy-program-dev.yml, which is
# itself the reduced pattern for every non-product gold domain (UIFPE-122,
# capabilities/data/gold-control-plane.md §2–3). See the tail of program's
# workflow for what a non-product domain deliberately does NOT do (no
# terraform, no Glue script upload, no UI build, no registry publish) — all
# of it applies to stock unchanged.
#
# Stock's artifacts are COMPILED, not hand-authored: the UIFPE-260 scaffolder
# generated them from the wizard intake (UIFPE-261), and the intake-compile
# workflow regenerates them whenever the intake changes.
#
# Branch → environment contract (ADR-0004): develop → dev. UAT and PROD are
# deliberately absent until their §CP-5 cutovers run.

on:
  push:
    branches: [develop]
    paths:
      - "domains/stock/**"
      - ".github/workflows/deploy-stock-dev.yml"
  workflow_dispatch:

# Per-domain concurrency group, same trade-off as program's (sanctioned by the
# UIFPE-122 steward model because this workflow writes only under stock's own
# entity prefix and its own config item — nothing shared to skew).
concurrency:
  group: deploy-stock-dev
  cancel-in-progress: false

jobs:
  # Per-domain latch, matching program's: the first load arms only when the
  # repo variable flips, so merging the compiled artifacts is safe by default.
  latched:
    name: Deploy stock latched off
    if: github.ref == 'refs/heads/develop' && vars.STOCK_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Stock dev deploy skipped — STOCK_DEPLOY_ENABLED != 'true'. Set the repo variable STOCK_DEPLOY_ENABLED=true once the one-time preconditions are in: Glue database uif_echo_dev_gold_stock exists, and the shared glue role can read uif_echo_dev_silver_tep.xxpso_inv_stock_atp_stg and write uif_echo_dev_gold_stock + s3://uif-echo-dev-gold/stock/*."

  deploy:
    name: Deploy stock to dev
    if: github.ref == 'refs/heads/develop' && vars.STOCK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install boto3 pyyaml jsonschema pytest

      # Test gate BEFORE any credential is assumed: stock's domain-local gates
      # plus the shared fail-closed artifact validation, so a drifted manifest
      # cannot reach S3.
      - name: Test gate
        run: |
          python3 -m pytest domains/stock/qe -q
          python3 stacks/echo/src/apps/cli/validate_gold_schemas.py --domain stock

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: eu-west-1

      # PER-ENTITY --delete, never the shared prefix (UIFPE-117) — the
      # destination is shared by every gold domain.
      - name: Sync schema + mapping artifacts
        run: |
          for d in domains/stock/src/schemas/gold/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/schemas/gold/$entity" --delete
          done
          for d in domains/stock/src/schemas/mapping/*/; do
            entity=$(basename "$d")
            aws s3 sync "$d" "s3://uif-echo-$ENV-gold-artifacts/mappings/$entity" --delete
          done

      - name: Sync pipeline configs (config-as-code)
        run: |
          # --repo-root scopes the read to this domain's pipelines/base/
          # (see program's workflow for the UNMANAGED-noise caveat on the
          # shared config table).
          python3 stacks/echo/src/apps/cli/sync_pipelines.py \
            --env "$ENV" --repo-root domains/stock/src/apps --apply

      - name: Summary
        run: |
          echo "::notice::Stock artifacts + pipeline config deployed to $ENV. The dispatcher fires the FULL LOAD on its first sweep (never-run pipeline = immediately due). Validate against the UIFPE-261 bar: 140,257 rows at (ppid, organizationCode), zero null keys, isbn13 null-or-^9 with 13 digits."
