name: Release event

# Cuts the build tag event/vX.Y.Z when stacks/event/VERSION changes on develop.
# Modelled on release-echo.yml: the declared version is validated by
# stacks/event/scripts/check-version.sh, the stacks-ci gate must have passed on
# the commit, and the tag is annotated with the evidence.
#
# ARTIFACTS (docs/uif-event-uat-rollout-plan.md, Phase 1). Like
# release-echo.yml, the `artifacts` job builds, hashes and uploads the stack's
# 6 release artifacts (4 Lambda zips, 2 Glue scripts) into
# uif-event-dev-release-artifacts, and the tag's manifest records each one's
# sha256, key and version id -- written by scripts/release-manifest.sh, which
# refuses a malformed hash or a failed gate. That manifest is what a later
# environment is deployed from. Tags cut before this change (event/v0.10.0)
# carry no artifacts block and cannot be promoted.
#
# WHY THIS POLLS FOR THE GATE INSTEAD OF USING workflow_run. A workflow_run
# trigger only fires for workflow files on the DEFAULT branch, and main is far
# behind develop. Same poll as release-echo.yml.

on:
  push:
    branches: [develop]
    paths:
      - "stacks/event/VERSION"
      # This file's own path is deliberately NOT listed: a push changing only
      # this file carries no VERSION bump, so check-version.sh would refuse with
      # "tag already exists" and every edit would produce a spurious red run.
  workflow_dispatch:

concurrency:
  group: release-event
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  COMPONENT: event
  # Dev builds; every later environment copies from here.
  BUCKET: uif-event-dev-release-artifacts

jobs:
  validate:
    name: Validate the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: check-version.sh compares against every
          # existing event/v* tag, and a shallow clone has none of them.
          fetch-depth: 0

      - name: Check VERSION
        id: check
        run: |
          set -euo pipefail
          tag="$(bash stacks/event/scripts/check-version.sh stacks/event/VERSION)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${tag}"

  gate:
    name: Require a green stacks-ci gate on this commit
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.poll.outputs.run_id }}
      conclusion: ${{ steps.poll.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The evidence commit is the nearest first-parent ancestor that touched
      # the paths stacks-ci scans; see release-echo.yml for the argument. The
      # equivalence is VERIFIED here rather than asserted.
      - name: Resolve which commit carries the stack evidence
        id: evidence
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="$(git rev-list --first-parent -n 1 "$SHA" -- stacks/ .github/workflows/stacks-ci.yml || true)"
          if [ -z "$evidence" ]; then
            echo "::error::No ancestor of ${SHA} has ever touched stacks/ or stacks-ci.yml, so there is no gate evidence to find."
            exit 1
          fi
          if [ "$evidence" != "$SHA" ]; then
            if ! git diff --quiet "$evidence" "$SHA" -- stacks/; then
              echo "::error::${SHA} differs from ${evidence} under stacks/, but only ${evidence} has a gate run. Refusing to accept evidence about different code."
              exit 1
            fi
            echo "::notice::${SHA} touches no stack, so its gate evidence is ${evidence}. Verified identical under stacks/."
          fi
          echo "sha=${evidence}" >> "$GITHUB_OUTPUT"

      - name: Wait for the stacks-ci gate to conclude
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.evidence.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          run_id=""

          while :; do
            if [ -z "$run_id" ]; then
              run_id="$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/stacks-ci.yml/runs?head_sha=${SHA}" \
                --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .id // empty' || true)"
            fi

            if [ -n "$run_id" ]; then
              # The gate JOB, not the run's overall conclusion: validate-sif is
              # continue-on-error, so a run can conclude success while the
              # aggregating gate job is what actually decides.
              row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                --jq '[.jobs[] | select(.name == "stacks-ci gate")] | last // {}
                      | [(.status // ""), (.conclusion // "")] | @tsv' || true)"
              status="$(printf '%s' "$row" | cut -f1)"
              conclusion="$(printf '%s' "$row" | cut -f2)"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::stacks-ci gate concluded '${conclusion}' on ${SHA} (run ${run_id}). A build tag is evidence the gate passed, so no tag will be created."
                  exit 1
                fi
                echo "run_id=${run_id}"         >> "$GITHUB_OUTPUT"
                echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"
                echo "::notice::stacks-ci gate passed on ${SHA} (run ${run_id})."
                exit 0
              fi
              echo "gate is '${status:-queued}' in run ${run_id}; waiting."
            else
              echo "no stacks-ci run for ${SHA} yet; waiting."
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 30 minutes waiting for the stacks-ci gate on ${SHA}."
              exit 1
            fi
            sleep 20
          done

  artifacts:
    name: Build, hash and stage the 6 artifacts
    needs: [validate, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The SAME script deploy-event-dev.yml stages with, so a dev apply and a
      # build tag cannot disagree about the artifact set. It asserts its own
      # row count; the check below is the hand-off guard.
      - name: Stage the artifacts
        run: |
          set -euo pipefail
          bash stacks/event/scripts/stage-release-artifacts.sh \
            --bucket "$BUCKET" --tsv "${RUNNER_TEMP}/artifacts.tsv"
          rows="$(grep -c . "${RUNNER_TEMP}/artifacts.tsv")"
          [ "$rows" -eq 6 ] \
            || { echo "::error::expected 6 artifact rows, got ${rows}."; exit 1; }
          cut -f1 "${RUNNER_TEMP}/artifacts.tsv" | sort | uniq -c | sed 's/^/  /'

      # Hashes, keys and version ids only -- no secret. Uploaded because it
      # crosses a job boundary.
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact-index
          path: ${{ runner.temp }}/artifacts.tsv
          retention-days: 1

  tag:
    name: Cut the build tag
    needs: [validate, gate, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-artifact-index
          path: ${{ runner.temp }}

      - name: Assemble the release manifest
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          GIT_COMMIT: ${{ github.sha }}
          GATE_RUN_ID: ${{ needs.gate.outputs.run_id }}
          GATE_CONCLUSION: ${{ needs.gate.outputs.conclusion }}
        run: |
          set -euo pipefail
          ARTIFACT_FILE="${RUNNER_TEMP}/artifacts.tsv" \
            bash stacks/event/scripts/release-manifest.sh > /tmp/manifest.yaml
          cat /tmp/manifest.yaml

      - name: Create and push the annotated tag
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -F /tmp/manifest.yaml
          git push origin "refs/tags/${TAG}"
          echo "::notice::Tagged ${TAG}"

      - name: Mirror it to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          # gh, not a third-party release action: the enterprise allow-list
          # rejects most marketplace actions and fails the whole workflow.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/manifest.yaml \
            --target "${GITHUB_SHA}"
          echo "::notice::Release ${TAG} published."
