name: Domain CD

# Monorepo CD, same shape as domain-ci.yml: one reusable workflow at the repo root,
# matrixed per touched domain, no per-domain workflow file. Runs after domain-ci.yml
# is green on main. Promotion is Dev -> QA -> Stage -> Prod, one job per environment,
# gated by GitHub Environment protection rules (Prod requires manual approval — set
# required reviewers on the "<domain>-production" Environment in repo Settings; this
# workflow does not and cannot enforce that from YAML alone).
#
# AWS auth: OIDC only, no long-lived keys. Each "<domain>-<env>" GitHub Environment
# holds an AWS_ROLE_ARN secret pointing at that domain's github-oidc-deploy-role
# Terraform output (infrastructure/terraform/modules/github-oidc-deploy-role). A job
# can only assume that role if its own Environment name matches one of the role's
# allowed_branches/allowed_environments trust conditions.
#
# "Deploy" here means: advance the desired state (bump the image digest into
# infrastructure/helm/values-<env>.yaml and commit). Argo CD reconciles the actual
# cluster to that commit — this workflow never runs `helm upgrade`/`kubectl apply`
# directly (capabilities/infrastructure/kubernetes.md "Sync & promote").

on:
  push:
    branches: [main]
    paths:
      - 'domains/**'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to promote (leave empty to detect from the last push)'
        required: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect domains to promote
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.filter.outputs.domains }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect touched domains
        id: filter
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.domain }}" ]; then
            DOMAINS_JSON=$(jq -R -c -n --arg d "${{ github.event.inputs.domain }}" '[$d]')
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              BASE_SHA=$(git rev-parse "$HEAD_SHA~1" 2>/dev/null || echo "$HEAD_SHA")
            fi
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            DOMAINS_RAW=$(echo "$CHANGED" | grep '^domains/' | cut -d/ -f2 | sort -u || true)
            if [ -z "$DOMAINS_RAW" ]; then
              DOMAINS_JSON="[]"
            else
              DOMAINS_JSON=$(echo "$DOMAINS_RAW" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi
          echo "domains=$DOMAINS_JSON" >> "$GITHUB_OUTPUT"
          echo "Promoting domains: $DOMAINS_JSON"

  deploy-dev:
    needs: detect
    if: needs.detect.outputs.domains != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.detect.outputs.domains) }}
    name: deploy (${{ matrix.domain }} / dev)
    environment: ${{ matrix.domain }}-dev
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Advance desired state (bump image digest)
        working-directory: domains/${{ matrix.domain }}
        run: echo "no values-dev.yaml digest bump wired yet for ${{ matrix.domain }} — add when the image build/push step lands"

      - name: Smoke + SLO check
        run: echo "no smoke/SLO check wired yet for ${{ matrix.domain }} (dev) — add when observability lands"

  deploy-qa:
    needs: [detect, deploy-dev]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.detect.outputs.domains) }}
    name: deploy (${{ matrix.domain }} / qa)
    environment: ${{ matrix.domain }}-qa
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Advance desired state (bump image digest)
        working-directory: domains/${{ matrix.domain }}
        run: echo "no values-qa.yaml digest bump wired yet for ${{ matrix.domain }} — add when the image build/push step lands"

      - name: Smoke + SLO check
        run: echo "no smoke/SLO check wired yet for ${{ matrix.domain }} (qa) — add when observability lands"

  deploy-stage:
    needs: [detect, deploy-qa]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.detect.outputs.domains) }}
    name: deploy (${{ matrix.domain }} / stage)
    environment: ${{ matrix.domain }}-stage
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Advance desired state (bump image digest)
        working-directory: domains/${{ matrix.domain }}
        run: echo "no values-stage.yaml digest bump wired yet for ${{ matrix.domain }} — add when the image build/push step lands"

      - name: Smoke + SLO check
        run: echo "no smoke/SLO check wired yet for ${{ matrix.domain }} (stage) — add when observability lands"

  deploy-prod:
    needs: [detect, deploy-stage]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.detect.outputs.domains) }}
    name: deploy (${{ matrix.domain }} / prod)
    # Manual approval gate: configure required reviewers on the "<domain>-production"
    # Environment in repo Settings -> Environments. This is what makes Prod a gated
    # promotion rather than an automatic one — GitHub pauses this job until approved.
    environment: ${{ matrix.domain }}-production
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Advance desired state (bump image digest)
        working-directory: domains/${{ matrix.domain }}
        run: echo "no values-prod.yaml digest bump wired yet for ${{ matrix.domain }} — add when the image build/push step lands"

      - name: Smoke + SLO check
        run: echo "no smoke/SLO check wired yet for ${{ matrix.domain }} (prod) — add when observability lands"
