name: Deploy echo — infra converge

# Converge ONE environment onto the infrastructure a build tag describes.
#
# Infrastructure does not promote, it CONVERGES: there is no infrastructure
# artifact to carry between environments, so this applies the same Terraform
# roots with that environment's tfvars (capabilities/delivery/stack-promotion-model.md).
# What binds it to a release is the build tag's manifest -- every artifact hash
# this run plans with is read from the tag, so an infra-only apply lands a known
# application version rather than whatever develop happens to hold.
#
# TWO ROOTS, IN ORDER. Echo is two Terraform roots with two states, and the
# order is not a preference:
#
#   1. infrastructure/terraform        creates the shared Glue role
#   2. infrastructure/terraform-gold   LOOKS THAT ROLE UP with data.aws_iam_role
#
# A data source that resolves to nothing fails the PLAN, so a first converge
# with the gold root first cannot even produce a plan. They run in one job, in
# that order.
#
# ARTIFACTS ARE COPIED BEFORE THE FIRST PLAN, and that is also not a preference.
# Nothing in a uif-echo stack reads its code from this repository: every Lambda,
# layer and Glue script resolves a content-addressed key, and terraform_data
# .artifact_shas_present refuses to plan when those keys carry the missing-hash
# sentinel (UIFPE-608). Its own note says how a promoted environment gets them:
#
#   "every other uif env is PROMOTED and gets them in an
#    artifacts.auto.tfvars.json built from the promoted digests. If that file is
#    absent, the promotion is what is incomplete -- do not stage from source to
#    fill the gap, or the release tag will attest to bytes nothing is running."
#
# So this workflow copies what the manifest names, writes the tfvars from the
# digests of what it actually copied, and only then plans. It never stages from
# source. dev is the only environment that builds.
#
# WHY IT IS SAFE TO MERGE THIS BEFORE AN ENVIRONMENT EXISTS. The mode comes from
# a repository variable that defaults to `skip` on a tag push, so with
# ECHO_UAT_INFRA unset a tag push resolves to skip, the converge job is skipped,
# and its `environment:` reference is never evaluated. That matters: naming an
# environment GitHub does not have makes GitHub create it implicitly with NO
# reviewer and NO tag policy, which is how "restricted release authority"
# becomes a sentence in a document. Run
# infrastructure/deploy/bootstrap-environment.sh first; it creates the
# environment WITH its protection, the derived deploy policy and the role secret.
#
# WHAT THIS IS NOT. It is not the promote. This job may change the shape of an
# environment; promote-echo.yml may only change which version runs in it, and
# refuses a plan that touches infrastructure. Both exist because those are
# different authorities over the same state.

on:
  push:
    tags:
      - "echo/v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [uat, prod]
        default: uat
      infra:
        description: "Terraform action"
        type: choice
        options: [plan, apply, bootstrap, skip]
        default: plan

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

  # Pinned, and it must not drift from the workflow that applies alongside it:
  # a saved plan file is only valid for the Terraform version that wrote it.
  # Same pin as deploy-apicurio-infra.yml.
  TF_VERSION: "1.15.8"

jobs:
  resolve:
    name: What this run will do
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.mode.outputs.environment }}
      infra: ${{ steps.mode.outputs.infra }}
      stem: ${{ steps.mode.outputs.stem }}
    steps:
      # fetch-depth 0 AND fetch-tags: read-manifest.sh reads the ANNOTATED TAG
      # message, which a shallow clone does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # actions/checkout fetches the resolved COMMIT SHA into refs/tags/<name>,
      # which produces a LIGHTWEIGHT tag locally and discards the annotation --
      # and the annotation IS the manifest. read-manifest.sh then correctly
      # refuses with "is a LIGHTWEIGHT tag, which has no message". `fetch-tags`
      # above asks for +refs/tags/* but shares one fetch with the sha refspec
      # and does not reliably win, so the tag object is re-fetched explicitly.
      # Verified on apicurio: without this, a dispatch failed at the first
      # manifest read (run 35603264803).
      - name: Re-fetch the annotated tag object
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          type="$(git cat-file -t "refs/tags/${TAG}")"
          [ "$type" = "tag" ] \
            || { echo "::error::refs/tags/${TAG} is a ${type}, not an annotated tag object, so it carries no manifest. The re-fetch did not recover the annotation."; exit 1; }
          echo "::notice::${TAG} is an annotated tag object; its manifest is readable."

      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          IN_ENV: ${{ inputs.environment }}
          IN_INFRA: ${{ inputs.infra }}
          VAR_UAT: ${{ vars.ECHO_UAT_INFRA }}
          VAR_PROD: ${{ vars.ECHO_PROD_INFRA }}
        run: |
          set -euo pipefail
          resolver=stacks/echo/scripts/resolve-deploy-mode.sh

          # A push carries no environment input, and uat is the only environment
          # a tag push targets. prod is reached by dispatch.
          environment="$("$resolver" \
            --event "$EVENT" --input "${IN_ENV:-}" --var "uat" \
            --allowed "uat,prod" --default "uat")"

          case "$environment" in
            uat)  var_value="${VAR_UAT:-}" ;;
            prod) var_value="${VAR_PROD:-}" ;;
          esac

          # DEFAULT skip. An unset variable on a tag push means this does
          # nothing, which is what makes the file safe to merge before
          # bootstrap-environment.sh has created the environment.
          infra="$("$resolver" \
            --event "$EVENT" --input "${IN_INFRA:-}" --var "$var_value" \
            --allowed "skip,plan,apply,bootstrap" --default "skip")"

          # The greenfield stacks' files are <env>-uif: envs/uat-uif.tfvars and
          # backends/uat-uif.hcl. The bare <env> names belong to the retiring
          # echo-<env>-* stacks, and pointing this workflow at those would
          # converge the OTHER stack -- naming is the only isolation between
          # them in one account (UIFPE-355 produced that failure once).
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "stem=${environment}-uif" >> "$GITHUB_OUTPUT"

          echo "### echo infra converge" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: \`${environment}\` (files: \`${environment}-uif\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- action: \`${infra}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$infra" = "skip" ]; then
            echo "::notice::infra=skip, so nothing will be planned or applied. Set the ECHO_<ENV>_INFRA repository variable, or dispatch with an explicit action."
          fi

      # Gated on the mode too. This step FAILS the run when the tag's gate did
      # not pass, which is right when something is about to be applied and
      # wrong when the mode is skip: a red run for a workflow that did nothing
      # teaches people to ignore red runs.
      - name: Report what the tag describes
        if: startsWith(github.ref, 'refs/tags/') && steps.mode.outputs.infra != 'skip'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          reader=stacks/echo/scripts/read-manifest.sh
          commit="$("$reader" "$TAG" git_commit)"
          gate="$("$reader" "$TAG" gate.conclusion)"
          bucket="$("$reader" "$TAG" bucket)"
          # The gate is the build tag's evidence. Converging from a tag whose
          # gate did not pass would deploy code CI never approved.
          [ "$gate" = "success" ] \
            || { echo "::error::${TAG}'s gate conclusion is '${gate}', not success. Refusing to converge from a tag with no passing gate."; exit 1; }
          echo "::notice::${TAG} built from ${commit} with a passing gate; artifacts in ${bucket}."

  converge:
    name: Converge ${{ needs.resolve.outputs.environment }} (${{ needs.resolve.outputs.infra }})
    needs: resolve
    if: needs.resolve.outputs.infra != 'skip'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    # One deploy at a time per environment, shared with promote-echo.yml, so an
    # infra apply and a promote cannot interleave on one state file.
    concurrency:
      group: echo-deploy-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.resolve.outputs.environment }}
      STEM: ${{ needs.resolve.outputs.stem }}
      TAG: ${{ github.ref_name }}
      MAIN_ROOT: stacks/echo/infrastructure/terraform
      GOLD_ROOT: stacks/echo/infrastructure/terraform-gold
      # TWO BACKEND-FILENAME CONVENTIONS, both live in this repo. The main root
      # uses backends/<env>.hcl; the gold root uses <env>.s3.tfbackend, which is
      # also product's, stacks/event's and delivery-lab's. Assuming one for both
      # makes the preflight refuse every converge, looking for a file nobody is
      # going to write.
      MAIN_BACKEND: backends/${{ needs.resolve.outputs.stem }}.hcl
      GOLD_BACKEND: backends/${{ needs.resolve.outputs.stem }}.s3.tfbackend

      # Pearson's five mandatory tag values. Passed HERE and consumed by the
      # MAIN root only -- it declares t_app_id and the rest, and the gold root
      # does not, so an undeclared-variable warning there is expected and
      # harmless. They deliberately have no defaults in variables.tf: a default
      # would let a wrong value ship silently, and a wrong t_cost_centre
      # misbills another team every month. TF_VAR_ names are CASE-SENSITIVE
      # against the variable, so TF_VAR_t_app_id, never TF_VAR_t_AppID.
      TF_VAR_t_app_id: ${{ vars.T_APP_ID }}
      TF_VAR_t_cost_centre: ${{ vars.T_COST_CENTRE }}
      TF_VAR_t_dcl: ${{ vars.ECHO_T_DCL }}
      TF_VAR_t_owner_individual: ${{ vars.T_OWNER_INDIVIDUAL }}
      TF_VAR_t_responsible_individuals: ${{ vars.T_RESPONSIBLE_INDIVIDUALS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Re-fetch the annotated tag object
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"

      # BEFORE ANYTHING IS TOUCHED. Half a converge is worse than none: the
      # main root applies, the gold root then fails at init on a backend file
      # nobody wrote, and the environment is left describing two different
      # releases. Both roots' files are asserted here, at once, while the run
      # has changed nothing.
      - name: Both roots have this environment's files
        run: |
          set -euo pipefail
          missing=""
          for f in "${MAIN_ROOT}/${MAIN_BACKEND}" \
                   "${MAIN_ROOT}/envs/${STEM}.tfvars" \
                   "${GOLD_ROOT}/${GOLD_BACKEND}" \
                   "${GOLD_ROOT}/envs/${STEM}.tfvars"; do
            [ -f "$f" ] || missing="${missing} ${f}"
          done
          if [ -n "$missing" ]; then
            echo "::error::this environment is not described by both roots. Missing:${missing}"
            echo "A converge needs a backend and a tfvars per ROOT, never a shared one:"
            echo "a tfvars is where the resource NAMES come from, so two roots reading"
            echo "one file resolve to one set of names."
            exit 1
          fi
          echo "::notice::both roots carry backends/${STEM}.hcl and envs/${STEM}.tfvars."

      # TWO STEPS, ONE PER ENVIRONMENT, each naming its secret literally.
      # bootstrap-environment.sh chose AWS_ROLE_ARN_ECHO_<ENV> so that the name
      # cannot collide with product's AWS_ROLE_ARN_UAT, cannot shadow apicurio's
      # unsuffixed AWS_ROLE_ARN on the same environment, and "answers 'whose
      # role is this' from the workflow file alone". Indexing secrets[] by a
      # computed name would defeat that last part; an && / || ternary would be
      # worse still, because an empty secret is falsy and prod would fall
      # through to uat's role without a word.
      - name: Assume uat's deploy role
        if: needs.resolve.outputs.environment == 'uat'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECHO_UAT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume prod's deploy role
        if: needs.resolve.outputs.environment == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_ECHO_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      # An absent secret does not fail configure-aws-credentials in a way that
      # names the cause, and the wrong role fails later on a permission that
      # reads like a policy gap. Prove which role this run holds, first.
      - name: Prove which role this run assumed
        run: |
          set -euo pipefail
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          echo "::notice::assumed ${arn}"
          case "$arn" in
            *"uif-echo-${ENV_NAME}"*) ;;
            *)
              echo "::error::this run assumed ${arn}, which is not a uif-echo-${ENV_NAME} role. Check that the environment holds AWS_ROLE_ARN_ECHO_$(printf %s "$ENV_NAME" | tr a-z A-Z) and that bootstrap-environment.sh has run for it. Nothing has been planned."
              exit 1 ;;
          esac

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Copy the bytes the manifest names into this environment, and write the
      # hashes of what actually landed. NOT a rebuild: copy-artifacts.sh reads
      # the source bucket from the manifest rather than taking it as a flag, so
      # nobody can promote from the wrong bucket while every hash still checks
      # out. Its --tfvars output is what satisfies the artifact guard.
      - name: Promote the artifacts this tag names
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          stacks/echo/scripts/copy-artifacts.sh \
            --tag "$TAG" \
            --to-bucket "uif-echo-${ENV_NAME}-release-artifacts" \
            --tfvars "${PWD}/artifacts.auto.tfvars.json" \
            --tsv "${PWD}/promoted-rows.tsv"
          rows="$(grep -c . promoted-rows.tsv)"
          echo "::notice::${rows} artifacts present in uif-echo-${ENV_NAME}-release-artifacts at the versions ${TAG} names."

      # Both roots read the same file, because both take artifact_shas and
      # lambda_code_hashes under those names (UIFPE-576 phases 1a and 1b).
      - name: Put the promoted hashes where both roots read them
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          for root in "$MAIN_ROOT" "$GOLD_ROOT"; do
            cp artifacts.auto.tfvars.json "${root}/artifacts.auto.tfvars.json"
          done
          echo "::notice::artifacts.auto.tfvars.json written into both roots."

      # ── root 1 of 2: the main root ────────────────────────────────────────
      #
      # THREE CONSTRAINTS, all load-bearing and all inherited from
      # deploy-apicurio-infra.yml:
      #  1. Plan and apply are in the SAME job -- same runner, same filesystem,
      #     nothing persisted. A saved plan is only valid for the Terraform
      #     version that wrote it, and it must not leave the runner.
      #  2. tf.plan is NEVER uploaded as an artifact, and `terraform show -json`
      #     never reaches a log. A saved plan carries every generated value, and
      #     grep finds nothing in it only because it is compressed.
      #  3. No -auto-approve: not a valid pairing with a plan file, and not
      #     needed, because Terraform does not prompt when handed one.
      #
      # -reconfigure: with `backend "s3" {}` plus -backend-config, init would
      # otherwise try to migrate state between differently-configured backends.
      # BEFORE INIT, because aws_s3_object.gcp_glue_jars reads these files off
      # local disk at apply time and the null_resource that downloads them only
      # runs when its triggers change. Once it is in state, a run on a fresh
      # runner skips the download and the apply dies with "no such file or
      # directory" -- which is what happened on run 36327029234, and would have
      # happened on every run after it. The script is idempotent, so a runner
      # that already has them pays nothing.
      #
      # Not gated per environment: generic_bronze_ingest passes these as
      # --extra-jars too, so they are not only for the GCP-native jobs.
      - name: Fetch the vendor JARs Terraform uploads
        run: stacks/echo/scripts/fetch-gcp-jars.sh

      - name: Init the main root
        working-directory: stacks/echo/infrastructure/terraform
        run: terraform init -reconfigure -input=false -backend-config="${MAIN_BACKEND}"

      - name: Plan the main root
        working-directory: stacks/echo/infrastructure/terraform
        run: terraform plan -input=false -var-file="envs/${STEM}.tfvars" -out=tf.plan

      - name: Apply the main root's reviewed plan
        if: needs.resolve.outputs.infra == 'apply' || needs.resolve.outputs.infra == 'bootstrap'
        working-directory: stacks/echo/infrastructure/terraform
        run: terraform apply -input=false tf.plan

      # ── root 2 of 2: the gold root ────────────────────────────────────────
      #
      # After the main root, always. This root LOOKS UP the shared Glue role
      # (data.aws_iam_role on uif-echo-<env>-glue-role) rather than declaring
      # it, and a data source that resolves to nothing fails the PLAN -- so on a
      # first converge this cannot produce a plan until the main root has run.
      - name: Init the gold root
        working-directory: stacks/echo/infrastructure/terraform-gold
        run: terraform init -reconfigure -input=false -backend-config="${GOLD_BACKEND}"

      - name: Plan the gold root
        working-directory: stacks/echo/infrastructure/terraform-gold
        run: terraform plan -input=false -var-file="envs/${STEM}.tfvars" -out=tf.plan

      - name: Apply the gold root's reviewed plan
        if: needs.resolve.outputs.infra == 'apply' || needs.resolve.outputs.infra == 'bootstrap'
        working-directory: stacks/echo/infrastructure/terraform-gold
        run: terraform apply -input=false tf.plan

      - name: Report what this environment now runs
        if: needs.resolve.outputs.infra == 'apply' || needs.resolve.outputs.infra == 'bootstrap'
        run: |
          set -euo pipefail
          {
            echo "### echo ${ENV_NAME} converged from ${TAG}"
            echo "- main root: applied"
            echo "- gold root: applied"
            echo "- artifacts: the versions ${TAG} names, copied into uif-echo-${ENV_NAME}-release-artifacts"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::converge complete. This does NOT cut a release tag: only promote-echo.yml does, and only on green smoke."
