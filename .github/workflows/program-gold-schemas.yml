name: Gold Schemas (program) — Validate

# Trigger paths, plus program's own qe suite. The gold gates are in
# gold-schemas.yml.
#
# Program does NOT publish: its master carries lifecycle: draft, and a service
# URN does not exist yet (UIFPE-116 open decision 4). When that lands, set
# `publish:` here - there is nothing to copy.
#
# The qe step stays in this caller rather than the shared body because product's
# suite is already gated on pull requests by product-ci.yml, so putting tests in
# the body would run product's twice. Program has no such workflow, and these 52
# gates - intake hygiene, mapping/master parity both ways, manifest/SQL parity,
# the sortKey invariant - run nowhere else on a pull request. Domain CI is
# disabled_manually, so `ci (program)` is not a substitute.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "domains/program/src/schemas/**"
      - "domains/program/qe/**"
      - "domains/program/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/program-gold-schemas.yml"
  push:
    branches: [main, develop]
    paths:
      - "domains/program/src/schemas/**"
      - "domains/program/qe/**"
      - "domains/program/src/apps/pipelines/**"
      - "stacks/echo/src/apps/cli/**"
      - ".github/workflows/gold-schemas.yml"
      - ".github/workflows/program-gold-schemas.yml"

jobs:
  gold-schemas:
    uses: ./.github/workflows/gold-schemas.yml
    with:
      domain: program

  qe:
    name: Program qe gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r domains/program/qe/requirements-dev.txt

      - name: Program qe gates
        run: python3 -m pytest domains/program/qe -q
