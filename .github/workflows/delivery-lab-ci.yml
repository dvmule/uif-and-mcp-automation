name: Delivery Lab CI

# CI for delivery-lab/ — the reference implementations and starter material
# (UIFPE-472). Until this file existed, a pull request touching only
# delivery-lab/** ran NOTHING: no tests, no lint, no terraform validate. The
# root CLAUDE.md is explicit that "an example that models bad practice teaches
# bad practice", and the schema-governance tooling here is executed by two
# PRODUCTION workflows (contract-governance.yml, generate-sdks.yml), so a break
# in it was caught only when those next ran, attributed to whatever happened to
# trigger them.
#
# TIER: teaching code, not a deployed service — deliberately lighter than
# stacks-ci.yml. Tests per package using each package's own manifest, terraform
# fmt+validate, and hadolint over the Dockerfiles. No container build, no SCA,
# no SAST: those belong to deployed estates.
#
# NO detect job and NO conditional matrix, deliberately (the UIFPE-491 lesson):
# stacks-ci's path-derived matrix ran ZERO jobs on a workflow-only diff, and
# the gap shipped a gate change untested. delivery-lab is small and its suites
# are cheap, so every job runs on every trigger — including a change to this
# file itself, which therefore genuinely tests itself.

on:
  push:
    branches: [main, develop]
    paths:
      - 'delivery-lab/**'
      - '.github/workflows/delivery-lab-ci.yml'
  pull_request:
    paths:
      - 'delivery-lab/**'
      - '.github/workflows/delivery-lab-ci.yml'

permissions:
  contents: read

jobs:
  # The higher tier of the two Python packages: production workflows run these
  # scripts, so their tests breaking is a production-tooling signal, not a
  # teaching-code nicety.
  schema-governance:
    name: schema-governance tests (production tooling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package's own pinned requirements
        working-directory: delivery-lab/reference-implementations/schema-governance
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          # requirements-dev.txt includes requirements.txt, so this is the
          # whole declared set — pinned by the package itself.
          python -m pip install --quiet -r requirements-dev.txt
      - name: pytest
        working-directory: delivery-lab/reference-implementations/schema-governance
        run: python -m pytest tests -q

  reference-api-fastapi:
    name: developer-registration-api-fastapi tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install via the package's own pyproject (dev extra)
        working-directory: delivery-lab/reference-implementations/api/developer-registration-api-fastapi
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e '.[dev]'
      - name: pytest (the package's own config carries its coverage floor)
        working-directory: delivery-lab/reference-implementations/api/developer-registration-api-fastapi
        run: |
          # --cov-fail-under=80 rides in via the package's pytest.ini_options,
          # so this one command is both the test gate and the coverage gate.
          python -m pytest -q

  reference-api-typescript:
    name: developer-registration-api tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: delivery-lab/reference-implementations/api/developer-registration-api/package-lock.json
      - name: npm ci + vitest + tsc
        working-directory: delivery-lab/reference-implementations/api/developer-registration-api
        run: |
          set -euo pipefail
          npm ci
          # The package's own scripts, so this gate cannot disagree with what
          # `npm test` does locally. `test` is vitest with coverage; `build` is
          # `tsc -p tsconfig.json`, which is the type check — vitest alone
          # strips types without checking them.
          npm test
          npm run build

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          # Same pin and same reason as stacks-ci.yml: 1.15.0 broke validate on
          # partial backend config; an unpinned version changes a run's verdict
          # with no commit.
          terraform_version: "1.15.8"
      - name: fmt + validate every terraform root under delivery-lab
        run: |
          set -euo pipefail
          # Discover roots rather than naming them, so a new reference
          # implementation's terraform is covered without editing this file —
          # but refuse to pass having found NOTHING, since an empty find would
          # make this job green vacuously (the validate_naming.py lesson).
          ROOTS=$(find delivery-lab -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          [ -n "$ROOTS" ] || { echo "::error::no terraform found under delivery-lab — either it was all removed (then remove this job deliberately) or the find pattern broke"; exit 1; }
          RC=0
          for dir in $ROOTS; do
            echo "::group::$dir"
            terraform -chdir="$dir" fmt -check -recursive || { echo "::error::$dir is not terraform-fmt clean"; RC=1; }
            # -backend=false with an isolated data dir: validate needs
            # providers, never credentials (same shape as apicurio's qe/ci.sh).
            TF_DATA_DIR="$RUNNER_TEMP/tfdata-$(echo "$dir" | tr / -)" \
              terraform -chdir="$dir" init -backend=false -input=false > /dev/null || { echo "::error::$dir failed init"; RC=1; echo "::endgroup::"; continue; }
            TF_DATA_DIR="$RUNNER_TEMP/tfdata-$(echo "$dir" | tr / -)" \
              terraform -chdir="$dir" validate || { echo "::error::$dir failed validate"; RC=1; }
            echo "::endgroup::"
          done
          exit "$RC"

  dockerfiles:
    name: hadolint over the reference Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hadolint (pinned binary, checksum verified)
        env:
          # Same pin and checksum as stacks-ci.yml — one hadolint verdict
          # estate-wide. Bump both files in the same commit.
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -euo pipefail
          url="https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          curl -fsSL -o /tmp/hadolint "$url"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint && sudo mv /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version
      - name: hadolint every Dockerfile under delivery-lab
        run: |
          set -uo pipefail
          FILES=$(find delivery-lab -name Dockerfile -not -path '*node_modules*')
          [ -n "$FILES" ] || { echo "::error::no Dockerfiles found under delivery-lab — remove this job deliberately or fix the find"; exit 1; }
          RC=0
          for f in $FILES; do
            echo "::group::$f"
            hadolint "$f" || RC=1
            echo "::endgroup::"
          done
          exit "$RC"

  gate:
    name: delivery-lab gate
    needs: [schema-governance, reference-api-fastapi, reference-api-typescript, terraform, dockerfiles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          SG: ${{ needs.schema-governance.result }}
          PY: ${{ needs.reference-api-fastapi.result }}
          TS: ${{ needs.reference-api-typescript.result }}
          TF: ${{ needs.terraform.result }}
          DK: ${{ needs.dockerfiles.result }}
        run: |
          set -euo pipefail
          rc=0
          # Unlike stacks-ci's gate, 'skipped' is NOT a pass here: nothing in
          # this workflow is conditional, so a skipped job can only mean a
          # cancelled dependency — treat anything but success as a failure.
          for pair in "schema-governance:$SG" "reference-api-fastapi:$PY" \
                      "reference-api-typescript:$TS" "terraform:$TF" "dockerfiles:$DK"; do
            job="${pair%%:*}"; res="${pair#*:}"
            case "$res" in
              success) echo "ok       $job" ;;
              *)       echo "::error::$job did not pass — result: ${res:-<none>}"; rc=1 ;;
            esac
          done
          exit "$rc"
